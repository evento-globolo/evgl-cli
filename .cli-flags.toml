[help]
url = "https://github.com/evento-globolo/evgl-cli"
columns = ["options", "env", "type", "default", "description"]

[parse]
command_env = "EVGL_COMMAND"
errors_env = "EVGL_PARSE_ERRORS"
unknown_options_env = "EVGL_UNKNOWN_OPTIONS"

[env]
ignore = ["EVGL_TOKEN", "SUPABASE_SERVICE_ROLE_KEY"]

[flags.base_url]
env = "EVGL_BASE_URL"
aliases = ["base-url"]
type = "string"
default = "http://127.0.0.1:8080"
help = "Base URL for the Evento Globolo API."

[flags.timeout_seconds]
env = "EVGL_TIMEOUT_SECONDS"
aliases = ["timeout-seconds"]
type = "integer"
default = 20
help = "HTTP timeout in seconds."

[flags.output]
env = "EVGL_OUTPUT"
aliases = ["output"]
type = "string"
default = "json"
help = "Output mode: json or text."

[commands.health]
help = "Check API health."

[commands.list]
help = "List events."

[commands.get]
help = "Get one event."
[commands.get.flags.id]
env = "EVGL_ID"
aliases = ["id"]
type = "string"
help = "Event UUID."

[commands.watch]
help = "Watch the API WebSocket event stream."
