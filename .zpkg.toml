[package]
org = "evento-globolo"
name = "evgl-cli"
version = "0.1.0"
description = "Operator CLI for Evento Globolo"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evgl-cli"

# Cargo.lock is authoritative for flags-2-env until it is published in Zed.
[dependencies]

[build]
command = "cargo build --release --locked --bin evgl-cli"
outputs = ["target/release/evgl-cli"]

[bin]
evgl-cli = "target/release/evgl-cli"

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/evgl-cli\" && \"$ZED_PKG_TEST_TARGET/target/release/evgl-cli\" --help >/dev/null"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", ".vendor/.zed/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[scripts]
test = "cargo test --all-targets --locked"
